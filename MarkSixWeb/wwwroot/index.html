<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkSixWeb</title>
    <!-- The GitHub Actions workflow rewrites this to /MarkSixWeb/ for GitHub Pages. Keep "/" for local runs. -->
    <base href="/" />
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MarkSixWeb.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Bootstrap Font Icon CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div id="app">
        <p style="padding:1rem;font-family:sans-serif;">Loading...</p>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Helpers used by Pages/MarkSix.razor (moved here: scripts inside .razor files are not executed in Blazor WebAssembly)
        function BlazorDownloadFile(filename, contentType, content) {
            // Create the URL
            const file = new File([content], filename, { type: contentType });
            const exportUrl = URL.createObjectURL(file);

            // Create the <a> element and click on it
            const a = document.createElement("a");
            document.body.appendChild(a);
            a.href = exportUrl;
            a.download = filename;
            a.target = "_self";
            a.click();

            // We don't need to keep the object URL, let's release the memory
            URL.revokeObjectURL(exportUrl);
            document.body.removeChild(a);
        }

        function SetImage(id, source) {
            var image = document.getElementById(id);
            if (image) image.src = source;
        }
    </script>
</body>

</html>
